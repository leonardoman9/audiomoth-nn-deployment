name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TFLM: third_party/tflite-micro
      MODEL: firmware/bird/model/bird_backbone_int8.tflite
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mtools qemu-system-arm clang
          python3 -m pip install --break-system-packages numpy ai-edge-litert

      - name: Restore TFLM (source, toolchain, libraries)
        id: tflm
        uses: actions/cache/restore@v4
        with:
          path: third_party/tflite-micro
          key: tflm-${{ runner.os }}-${{ hashFiles('scripts/setup_tflm.sh', 'scripts/build_tflm.sh', 'firmware/patches/*') }}

      - name: Fetch and build TFLM
        if: steps.tflm.outputs.cache-hit != 'true'
        run: scripts/setup_tflm.sh && HOST=1 scripts/build_tflm.sh

      # saved right away, so a failing test later does not throw the ~10-minute TFLM build away
      - name: Save TFLM
        if: steps.tflm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/tflite-micro
          key: ${{ steps.tflm.outputs.cache-primary-key }}

      - name: Schedule and log logic (with sanitizers)
        run: |
          clang -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Ifirmware/app \
            firmware/app/schedule.c tests/schedule/test_schedule.c -lm -o /tmp/test_schedule
          python3 tests/schedule/test_schedule.py /tmp/test_schedule | tee /tmp/schedule.txt
          grep -q "mismatches 0" /tmp/schedule.txt

      - name: FatFS on a FAT32 image
        run: |
          MTOOLS_SKIP_CHECK=1 mformat -C -F -T 262144 -i /tmp/card.img ::
          tests/fstest/run_fstest.sh /tmp/card.img

      - name: Firmware build and flash budget
        run: |
          firmware/app/build_app.sh $TFLM $MODEL | tee /tmp/build.txt
          size=$(sed -n 's/^flash image: *\([0-9]*\) bytes.*/\1/p' /tmp/build.txt)
          echo "flash: $size of 245760 bytes"
          [ "$size" -le 245760 ]
          EXTRA_CF=-DBIRD_DIAG_RECORD firmware/app/build_app.sh $TFLM $MODEL | grep "flash image"

      - name: Simulator with sanitizers (2 days, fault scenarios)
        run: |
          SAN=1 OUTSUFFIX=_san tests/sim/build_sim.sh $TFLM $MODEL
          python3 tests/sim/make_test_audio.py /tmp/audio.raw 60
          python3 tests/sim/run_scenario.py tests/sim/out_san/bird_logger_sim /tmp/audio.raw /tmp/days 2 | tee /tmp/days.txt
          python3 tests/sim/check_long_run.py /tmp/days 2026-10-21 2
          python3 tests/sim/run_faults.py tests/sim/out_san/bird_logger_sim /tmp/audio.raw /tmp/faults

      - name: Full pipeline on an emulated Cortex-M4F (QEMU)
        run: tests/qemu/run_qemu_pipeline.sh $TFLM python3
